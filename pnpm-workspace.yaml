packages:
  - "."
  - "apps/docs"
  - "examples"
  - "examples/compatibility/*"
  - "examples/mixed-federation/*"
  - "examples/mixed-federation-issues/*"
  - "examples/nested-federation/*"
  - "examples/showcase/**"
  - "fixtures/**/*"

catalog:
  react: 19.2.8
  react-dom: 19.2.8

saveExact: true
strictPeerDependencies: false
# Exact pins + frozen lockfiles are the trust boundary; keep installs reproducible in CI.
minimumReleaseAge: 0

# GHSA-qwww-vcr4-c8h2 / issue #61 — Rspress still depends on react-router-dom ^7
# (which pins react-router 7.x). Drop this override when @rspress/core depends on
# react-router >=8.3.0. react-router-dom has no 8.x release yet.
overrides:
  react-router: 8.3.0

allowBuilds:
  "@parcel/watcher": false
  core-js: false
  esbuild: true
  husky: true
  unrs-resolver: true
