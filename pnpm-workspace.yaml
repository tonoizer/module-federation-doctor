packages:
  - "."
  - "apps/docs"
  - "examples"
  - "examples/compatibility/*"
  - "examples/mixed-federation/*"
  - "examples/mixed-federation-issues/*"
  - "examples/nested-federation/*"
  - "examples/standalone-findings/*"
  - "examples/showcase/**"
  - "fixtures/**/*"

catalog:
  react: 19.3.0
  react-dom: 19.2.8

saveExact: true
strictPeerDependencies: false

# Supply-chain guardrails. Keep these settings explicit so a pnpm upgrade cannot
# silently weaken the repository's install policy.
# Wait ten days before accepting a newly published version, including transitive
# dependencies. Strict mode prevents falling back to a too-new version.
minimumReleaseAge: 14400
minimumReleaseAgeStrict: true
# Fail closed when registry metadata does not provide a publication timestamp.
minimumReleaseAgeIgnoreMissingTime: false
# Dependabot/GHSA patch releases below are explicitly used by this lockfile.
# Keep these entries exact; do not broaden this security exception by package
# name or wildcard, and keep the ten-day minimum-release policy enabled.
minimumReleaseAgeExclude:
  # Vite+ 0.2.9 is the reviewed toolchain selected for the v1 build migration.
  # Keep every exception exact so future Vite+ releases still wait ten days.
  - vite-plus@0.2.9
  - "@voidzero-dev/vite-plus-core@0.2.9"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.9"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.9"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.9"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.9"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.9"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.9"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.9"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.9"
  - js-yaml@3.15.1 || 4.3.1
# Reject releases whose npm trust evidence is weaker than an earlier release.
trustPolicy: no-downgrade
# Vite 5.4.21 is the security backport for intentional Vite 5 compatibility cells.
# It was published after Vite 7.1.11 adopted OIDC trusted publishing, so pnpm's
# publish-date-based trust check treats the backport as a downgrade (provenance
# vs trusted publisher) even though it is the correct Vite 5 patch line.
# Keep this exact; do not broaden by package name or wildcard.
trustPolicyExclude:
  - vite@5.4.21
# Re-check the lockfile against the registry; do not treat it as implicitly trusted.
trustLockfile: false
# Transitive dependencies must not come from arbitrary git repositories or URLs.
blockExoticSubdeps: true

# Reproducibility and execution guardrails.
# Refuse to run scripts against a stale node_modules tree.
verifyDepsBeforeRun: error
# Dependency lifecycle scripts require explicit review below.
strictDepBuilds: true
# Keep the escape hatch visible and disabled in the committed policy.
dangerouslyAllowAllBuilds: false

# GHSA-qwww-vcr4-c8h2 / issue #61, Rspress still depends on react-router-dom ^7
# (which pins react-router 7.x). Drop this override when @rspress/core depends on
# react-router >=8.3.0. react-router-dom has no 8.x release yet.
# Dependabot alert #48 / GHSA-2v37-7h3g-55p8, nanoid <3.3.18 infinite loop when size is zero. Drop when upstream pins >=3.3.18.
# Dependabot alerts #57/#59/#69, fast-uri <3.1.8 (GHSA-58mr-gqgx-xq4g,
# GHSA-qw65-cvwx-89v3, GHSA-hrr3-gc8f-f4qj; also covers #49–#52). Drop when
# upstream pins >=3.1.8.
# Dependabot alerts #54/#55 / GHSA-82fw-gwwq-j7x9, vitest/@vitest/mocker
# <4.1.11 path traversal via redirect mock. Root is already vite-plus 0.3.0 +
# vitest 4.1.11; remaining 4.1.10 came from examples/compatibility/rolldown
# (vite-plus@0.2.9). Drop when that cell pins vite-plus that includes >=4.1.11.
# Dependabot alert #56 / GHSA-vwc7-r8mq-g2x9, adm-zip 0.5.9–0.6.0 follows
# extraction-destination symlinks (CVE-2026-76845). Transitive via
# @module-federation/dts-plugin@2.9.0. Drop when dts-plugin pins adm-zip >=0.6.1.
# Dependabot alerts #58–#68, undici <7.29.1 (GHSA-rfgv-xxqx-mfg5,
# GHSA-w293-vg96-wgc3, GHSA-pmjh-fq2x-6v4x, GHSA-3xpg-4rpp-hhhm,
# GHSA-2jfj-6hjv-fm6j, GHSA-rx4f-c7p8-82vq, GHSA-3wwx-pv8p-q78v,
# GHSA-r53p-7pc4-xj5r, GHSA-2gqq-gqf2-x968, GHSA-8436-99hf-9mmv).
# Transitive via @module-federation/dts-plugin@2.9.0. Drop when dts-plugin
# pins undici >=7.29.1.
overrides:
  react-router: 8.3.0
  "nanoid@3": 3.3.18
  "fast-uri@3": 3.1.8
  adm-zip: 0.6.1
  "undici@7": 7.29.1
  "vitest@4": 4.1.11
  "@vitest/browser@4": 4.1.11
  "@vitest/browser-preview@4": 4.1.11
  "@vitest/expect@4": 4.1.11
  "@vitest/mocker@4": 4.1.11
  "@vitest/pretty-format@4": 4.1.11
  "@vitest/runner@4": 4.1.11
  "@vitest/snapshot@4": 4.1.11
  "@vitest/spy@4": 4.1.11
  "@vitest/utils@4": 4.1.11

allowBuilds:
  "@parcel/watcher": false
  core-js: false
  esbuild: true
  husky: true
  unrs-resolver: true
