packages:
  - "."
  - "apps/docs"
  - "examples"
  - "examples/compatibility/*"
  - "examples/mixed-federation/*"
  - "examples/mixed-federation-issues/*"
  - "examples/showcase/**"
  - "fixtures/**/*"

catalog:
  react: 19.2.8
  react-dom: 19.2.8

saveExact: true
strictPeerDependencies: false
# Exact pins + frozen lockfiles are the trust boundary; keep installs reproducible in CI.
minimumReleaseAge: 0

allowBuilds:
  "@parcel/watcher": false
  core-js: false
  esbuild: true
  husky: true
  unrs-resolver: true
