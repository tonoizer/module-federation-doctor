name: Workspace federation gate
description: Discover mfdoctor project.json facts across a monorepo and run the offline federation gate (JSON/SARIF).
author: mfdoctor

branding:
  icon: activity
  color: blue

inputs:
  roots:
    description: >-
      Workspace roots to search for **/.mf/doctor/project.json (newline or
      space separated). Defaults to the working directory.
    required: false
    default: "."
  globs:
    description: >-
      Optional override globs (manual escape hatch). Newline or space
      separated. When set, replaces the default mfdoctor project.json layout.
    required: false
    default: ""
  formats:
    description: Comma-separated output formats (terminal, json, sarif).
    required: false
    default: "terminal,json,sarif"
  working-directory:
    description: Directory to run the gate from (report output lands under .mf/doctor here).
    required: false
    default: "."
  build-command:
    description: >-
      Optional shell command that builds each app with the mfdoctor plugin so
      project.json facts exist before the gate. Leave empty when builds already ran.
    required: false
    default: ""
  cli:
    description: >-
      Command used to invoke mfdoctor (for example `mfdoctor`,
      `vp exec mfdoctor`, or `node dist/cli.js`).
    required: false
    default: "mfdoctor"
  install:
    description: >-
      When true, install package-spec with npm before requiring the CLI. Use when
      the job has not already installed @tonoizer/mfdoctor.
    required: false
    default: "false"
  package-spec:
    description: >-
      npm package specifier installed when install is true (for example
      @tonoizer/mfdoctor@1.1.0).
    required: false
    default: "@tonoizer/mfdoctor"
  upload-sarif:
    description: Upload .mf/doctor/results.sarif with github/codeql-action/upload-sarif.
    required: false
    default: "true"
  sarif-category:
    description: Code scanning category for the uploaded SARIF.
    required: false
    default: "module-federation-doctor"
  upload-artifact:
    description: Upload JSON/SARIF reports as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name for the uploaded reports artifact.
    required: false
    default: "mfdoctor-federation"
  require-complete:
    description: Fail when the federation report is incomplete or required build evidence is missing.
    required: false
    default: "false"

outputs:
  report-json:
    description: Path to the federation report.json when json format is enabled.
    value: ${{ steps.gate.outputs.report-json }}
  report-sarif:
    description: Path to results.sarif when sarif format is enabled.
    value: ${{ steps.gate.outputs.report-sarif }}
  exit-code:
    description: Gate exit code (0 pass, 1 policy or strict-completeness fail, 2 legacy incomplete).
    value: ${{ steps.gate.outputs.exit-code }}
  policy-result:
    description: Policy result independent of report completeness (pass, fail, or unknown).
    value: ${{ steps.gate.outputs.policy-result }}
  completeness:
    description: Report completeness (complete or incomplete).
    value: ${{ steps.gate.outputs.completeness }}
  complete:
    description: Whether the report contains complete required evidence (true or false).
    value: ${{ steps.gate.outputs.complete }}
  incomplete-reasons:
    description: Comma-separated report completeness reason codes.
    value: ${{ steps.gate.outputs.incomplete-reasons }}

runs:
  using: composite
  steps:
    - name: Prepare federation report artifacts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -e
        mkdir -p .mf/doctor
        rm -f .mf/doctor/report.json .mf/doctor/results.sarif

    - name: Build apps (optional)
      if: ${{ inputs.build-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Ensure mfdoctor CLI
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MFDOCTOR_CLI: ${{ inputs.cli }}
        MFDOCTOR_INSTALL: ${{ inputs.install }}
        MFDOCTOR_PACKAGE_SPEC: ${{ inputs.package-spec }}
      run: bash "${{ github.action_path }}/ensure-cli.sh"

    - name: Run workspace federation gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MFDOCTOR_CLI: ${{ inputs.cli }}
        MFDOCTOR_ROOTS: ${{ inputs.roots }}
        MFDOCTOR_GLOBS: ${{ inputs.globs }}
        MFDOCTOR_FORMATS: ${{ inputs.formats }}
        MFDOCTOR_REQUIRE_COMPLETE: ${{ inputs.require-complete }}
        MFDOCTOR_REPORT_JSON: .mf/doctor/report.json
      run: |
        set +e
        report_dir=".mf/doctor"
        report_json="${report_dir}/report.json"
        report_sarif="${report_dir}/results.sarif"
        mkdir -p "${report_dir}"
        # Each invocation owns a fresh report set. This prevents a missing or
        # failed run from uploading artifacts produced by an earlier run.
        rm -f "${report_json}" "${report_sarif}"
        run_id="$(node -p 'require("node:crypto").randomUUID()')"
        run_started_at="$(node -p 'Date.now().toString()')"
        run_marker="${report_dir}/.workspace-federation-gate-${run_id}.run"
        printf '%s\n' "${run_id}" > "${run_marker}"
        trap 'rm -f "${run_marker}"' EXIT
        args=(workspace)
        # shellcheck disable=SC2206
        roots=(${MFDOCTOR_ROOTS})
        if [ "${#roots[@]}" -eq 0 ]; then
          roots=(.)
        fi
        args+=("${roots[@]}")
        if [ -n "${MFDOCTOR_GLOBS}" ]; then
          # shellcheck disable=SC2206
          globs=(${MFDOCTOR_GLOBS})
          for glob in "${globs[@]}"; do
            args+=(--glob "${glob}")
          done
        fi
        formats="${MFDOCTOR_FORMATS:-terminal,json,sarif}"
        if [ "${MFDOCTOR_REQUIRE_COMPLETE}" = "true" ]; then
          case ",${formats}," in
            *,json,*) ;;
            *) formats="${formats},json" ;;
          esac
          args+=(--require-complete)
        fi
        args+=(--format "${formats}")
        # shellcheck disable=SC2086
        ${MFDOCTOR_CLI} "${args[@]}"
        code=$?
        set -e
        set +e
        REPORT_STATUS_RUN_ID="${run_id}" \
        REPORT_STATUS_STARTED_AT="${run_started_at}" \
        REPORT_STATUS_RUN_MARKER="${run_marker}" \
        bash "${{ github.action_path }}/report-status.sh"
        completeness_code=$?
        set -e
        if [ "${completeness_code}" -ne 0 ] && [ "${MFDOCTOR_REQUIRE_COMPLETE}" = "true" ]; then
          code=1
        fi
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        if [ -f "${report_json}" ]; then
          echo "report-json=${report_json}" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "${report_sarif}" ]; then
          echo "report-sarif=${report_sarif}" >> "$GITHUB_OUTPUT"
        fi
        exit "${code}"

    - name: Upload federation reports
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/.mf/doctor/report.json
          ${{ inputs.working-directory }}/.mf/doctor/results.sarif
        if-no-files-found: ignore

    - name: Upload SARIF
      id: upload-sarif
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/.mf/doctor/results.sarif', inputs.working-directory)) != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
      with:
        sarif_file: ${{ inputs.working-directory }}/.mf/doctor/results.sarif
        category: ${{ inputs.sarif-category }}

    - name: Require successful SARIF upload
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/.mf/doctor/results.sarif', inputs.working-directory)) != '' }}
      shell: bash
      env:
        MFDOCTOR_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        MFDOCTOR_SARIF_OUTCOME: ${{ steps.upload-sarif.outcome }}
      run: bash "${{ github.action_path }}/require-sarif-upload.sh"
