name: Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: ${{ matrix.node }}
      - run: vp run pack:check
