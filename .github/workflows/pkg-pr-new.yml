name: Package preview

on:
  push:
    branches: [main]
  pull_request:

# Private repos need contents:read for checkout. pull-requests:write lets
# pkg.pr.new comment install URLs when the GitHub App is installed.
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Requires https://github.com/apps/pkg-pr-new on this repo.
      # --compact needs the package on npm; omit until first publish.
      - run: pnpm dlx pkg-pr-new@0.0.80 publish
