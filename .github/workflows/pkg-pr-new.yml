name: Package preview

on:
  push:
    branches: [main]
  pull_request:

# Private repos need contents:read for checkout. pull-requests:write lets
# pkg.pr.new comment install URLs when the GitHub App is installed.
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --compact requires the package on npm; drop it until first publish.
      # Install https://github.com/apps/pkg-pr-new on this repo to enable previews.
      - name: Publish package preview
        run: |
          set +e
          output="$(pnpm dlx pkg-pr-new@0.0.80 publish 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$output" | grep -q 'is not installed'; then
            echo "::warning::pkg.pr.new GitHub App is not installed. Install https://github.com/apps/pkg-pr-new to enable package previews."
            exit 0
          fi
          exit "$status"
