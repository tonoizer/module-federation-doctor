name: Package preview

on:
  push:
    branches: [main]
  pull_request:

# Private repos need contents:read for checkout. pull-requests:write lets
# pkg.pr.new comment install URLs when the GitHub App is installed.
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Requires https://github.com/apps/pkg-pr-new on this repo.
      # --compact needs the package on npm; omit until first publish.
      - run: pnpm dlx pkg-pr-new@0.0.80 publish
