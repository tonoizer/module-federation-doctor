name: Compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      bundlers: ${{ steps.matrix.outputs.bundlers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: matrix
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const matrix = JSON.parse(fs.readFileSync("fixtures/compatibility-matrix.json", "utf8"));
          const bundlers = matrix.localCi.map((cell) => ({
            id: cell.id,
            filter: cell.package,
            dir: cell.fixture,
          }));
          process.stdout.write(`bundlers=${JSON.stringify(bundlers)}\n`);
          NODE

  # High-value cells: real build + MFDoctor path per supported bundler on
  # Engines floor (Node 22), active LTS (Node 24), and current line (Node 26).
  bundler:
    needs: matrix
    name: ${{ matrix.bundler.id }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        bundler: ${{ fromJSON(needs.matrix.outputs.bundlers) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: Build ${{ matrix.bundler.id }} example with MFDoctor
        # CI env enables failOn:error + terminal/json/sarif from the adapter.
        run: |
          set -o pipefail
          pnpm --filter ${{ matrix.bundler.filter }} build 2>&1 | tee "${{ matrix.bundler.dir }}/doctor-terminal.txt"
      - name: Assert MFDoctor project + JSON + SARIF + terminal
        run: >
          node scripts/verify-compatibility-cell.mjs
          ${{ matrix.bundler.dir }}
          ${{ matrix.bundler.id }}
          ${{ matrix.bundler.dir }}/doctor-terminal.txt
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-${{ matrix.bundler.id }}-node${{ matrix.node }}
          path: |
            ${{ matrix.bundler.dir }}/.mf/doctor
            ${{ matrix.bundler.dir }}/doctor-terminal.txt
          if-no-files-found: ignore

  # CLI report-surface smoke (terminal, json, sarif) on a config-only partial path.
  cli-reports:
    name: CLI report surfaces / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: CLI check with terminal,json,sarif
        working-directory: examples/showcase/config/filename-invalid
        run: |
          set +e
          node ../../../../dist/cli.js check --format terminal,json,sarif 2>&1 | tee doctor-terminal.txt
          code=${PIPESTATUS[0]}
          set -e
          test -s doctor-terminal.txt
          test -f .mf/doctor/report.json
          test -f .mf/doctor/results.sarif
          # Intentional misconfig fixture: policy exit 1 is expected.
          test "$code" -eq 1
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-cli-reports-node${{ matrix.node }}
          path: |
            examples/showcase/config/filename-invalid/.mf/doctor
            examples/showcase/config/filename-invalid/doctor-terminal.txt
          if-no-files-found: ignore
