name: MFDoctor dogfood

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: 24
      - run: vp run build
      - run: vp run test:examples
      - run: vp run test:nested
      - name: Analyze federation (workspace gate)
        uses: ./.github/actions/workspace-federation-gate
        with:
          roots: examples/mixed-federation
          cli: node dist/cli.js
          formats: terminal,json,sarif
          upload-sarif: "true"
          upload-artifact: "false"
          artifact-name: doctor-federation
      - name: Analyze nested federation (workspace gate)
        uses: ./.github/actions/workspace-federation-gate
        with:
          roots: examples/nested-federation
          cli: node dist/cli.js
          formats: terminal,json,sarif
          upload-sarif: "true"
          upload-artifact: "false"
          artifact-name: doctor-nested-federation
          sarif-category: module-federation-doctor-nested
      - if: always()
        run: node scripts/github-annotations.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: doctor-reports
          path: |
            examples/mixed-federation/*/.mf/doctor
            examples/nested-federation/*/.mf/doctor
            .mf/doctor
