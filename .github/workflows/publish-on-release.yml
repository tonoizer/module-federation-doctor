name: Stage npm package on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plain-semver tag
        required: true
        type: string

permissions:
  contents: read

env:
  # Pack validation intentionally runs in temporary non-Git directories.
  HUSKY: "0"

concurrency:
  group: npm-stage-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    name: Resolve immutable release tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      package-exists: ${{ steps.registry.outputs.exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${TAG}" in v*) echo "Tag must not start with v"; exit 1;; esac
          test "${TAG}" = "${VERSION}" || {
            echo "Tag ${TAG} does not match package ${VERSION}"
            exit 1
          }
          test "$(git tag --points-at HEAD --list "${TAG}")" = "${TAG}" || {
            echo "${TAG} is not an immutable tag at the checked-out commit"
            exit 1
          }
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - id: registry
        name: Check whether the npm package is bootstrapped
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --retry 3 \
            --output /dev/null --write-out '%{http_code}' \
            'https://registry.npmjs.org/%40tonoizer%2Fmfdoctor')"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT";;
            404) echo "exists=false" >> "$GITHUB_OUTPUT";;
            *) echo "Unexpected npm registry response: $status"; exit 1;;
          esac

  verify:
    needs: resolve-ref
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          node-version: ${{ matrix.node-version }}
      - run: vp exec playwright install chromium
      - run: vp run check

  stage:
    needs: [resolve-ref, verify]
    if: needs.resolve-ref.outputs.package-exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: vp run release:dry-run
      - name: Select npm tag
        id: npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT";;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT";;
          esac
      - name: Refuse existing version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@tonoizer/mfdoctor@${VERSION}" version >/dev/null 2>&1; then
            echo "Refusing to overwrite @tonoizer/mfdoctor@${VERSION}"
            exit 1
          fi
      - name: Stage with trusted publishing
        run: npm stage publish . --access public --tag "${{ steps.npm.outputs.tag }}"
      - name: Summary
        if: always()
        run: |
          echo "## npm staged release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`@tonoizer/mfdoctor\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$(node -p "require('./package.json').version")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm tag: \`${{ steps.npm.outputs.tag || 'unknown' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication: GitHub OIDC; no long-lived publish token" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: approve the staged package with npm account 2FA" >> "$GITHUB_STEP_SUMMARY"

  bootstrap-notice:
    name: First-package bootstrap required
    needs: [resolve-ref, verify]
    if: needs.resolve-ref.outputs.package-exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Record the one-time manual bootstrap boundary
        env:
          TAG: ${{ needs.resolve-ref.outputs.tag }}
          SHA: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          echo "## First npm publish: one-time manual bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "The npm package does not exist yet, so npm cannot accept a trusted publisher." >> "$GITHUB_STEP_SUMMARY"
          echo "After explicit release approval, check out the clean tag \`$TAG\` at \`$SHA\` and run:" >> "$GITHUB_STEP_SUMMARY"
          echo '\`npm publish --access public --tag next\`' >> "$GITHUB_STEP_SUMMARY"
          echo "Then configure the npm trusted publisher for this workflow. No package was published by this run." >> "$GITHUB_STEP_SUMMARY"
