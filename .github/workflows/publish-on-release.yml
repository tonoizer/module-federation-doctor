name: Stage npm package on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plain-semver tag
        required: true
        type: string

permissions:
  contents: read

env:
  # Pack validation intentionally runs in temporary non-Git directories.
  HUSKY: "0"

concurrency:
  group: npm-stage-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Job/output names must not contain head|sha|commit|branch|ref. CodeQL's
  # ActionsSHACheckout / ActionsMutableRefCheckout heuristics treat those
  # tokens in needs.<job>.outputs.<field> as an untrusted PR HEAD checkout.
  pin-release:
    name: Pin immutable release tag
    # GITHUB_TOKEN does not re-trigger this workflow when the later promote
    # job undrafts the GitHub Release. Still ignore `release: published` from
    # github-actions[bot] so a PAT or future token change cannot double-stage.
    # workflow_dispatch from create-release.yml is the intended path and still
    # runs when the actor is the bot.
    if: github.event_name != 'release' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      oid: ${{ steps.resolve.outputs.oid }}
      tag: ${{ steps.resolve.outputs.tag }}
      package-exists: ${{ steps.registry.outputs.exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${TAG}" in v*) echo "Tag must not start with v"; exit 1;; esac
          test "${TAG}" = "${VERSION}" || {
            echo "Tag ${TAG} does not match package ${VERSION}"
            exit 1
          }
          test "$(git tag --points-at HEAD --list "${TAG}")" = "${TAG}" || {
            echo "${TAG} is not an immutable tag at the checked-out commit"
            exit 1
          }
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          REMOTE_TAGS="$(git ls-remote --exit-code --tags origin \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          REMOTE_COMMIT="$(printf '%s\n' "$REMOTE_TAGS" | awk -v tag="$TAG" '
            $2 == "refs/tags/" tag "^{}" { print $1; found=1; exit }
            $2 == "refs/tags/" tag { direct=$1 }
            END { if (!found && direct) print direct }
          ')"
          test "$REMOTE_COMMIT" = "$CHECKED_OUT_COMMIT" || {
            echo "Remote tag ${TAG} resolves to ${REMOTE_COMMIT}, but checkout is ${CHECKED_OUT_COMMIT}"
            exit 1
          }
          echo "oid=${CHECKED_OUT_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - id: registry
        name: Check whether the npm package is bootstrapped
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --retry 3 \
            --output /dev/null --write-out '%{http_code}' \
            'https://registry.npmjs.org/%40tonoizer%2Fmfdoctor')"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT";;
            404) echo "exists=false" >> "$GITHUB_OUTPUT";;
            *) echo "Unexpected npm registry response: $status"; exit 1;;
          esac

  verify:
    needs: pin-release
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.pin-release.outputs.oid }}
          persist-credentials: false
      - name: Use current release pack harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: .release-tooling
          # Cone mode only accepts directory prefixes. File paths such as
          # scripts/pack-check.mjs are not fetched.
          sparse-checkout: |
            scripts
            test/e2e
            examples/mixed-federation
            examples/mixed-federation-issues
            examples/nested-federation
            examples/compatibility/vite-nitro-react
          persist-credentials: false
      - name: Refresh release pack harness
        run: |
          # Examples and the mixed-federation Playwright spec are not published.
          # Overlay them from main so Verify can pick up runtime-smoke fixes
          # without rewriting an immutable release tag.
          test -f .release-tooling/scripts/pack-check.mjs
          test -f .release-tooling/scripts/giga-smoke.mjs
          test -f .release-tooling/test/e2e/mixed-federation.spec.ts
          cp .release-tooling/scripts/pack-check.mjs scripts/pack-check.mjs
          cp .release-tooling/scripts/giga-smoke.mjs scripts/giga-smoke.mjs
          cp .release-tooling/test/e2e/mixed-federation.spec.ts test/e2e/mixed-federation.spec.ts
          for tree in \
            examples/mixed-federation \
            examples/mixed-federation-issues \
            examples/nested-federation \
            examples/compatibility/vite-nitro-react
          do
            test -d ".release-tooling/${tree}"
            rm -rf "${tree}"
            cp -a ".release-tooling/${tree}" "${tree}"
          done
          grep -q reactFromLoadShare examples/mixed-federation/host-vite/src/bootstrap.tsx
          grep -q '"react/"' examples/mixed-federation/host-vite/vite.config.ts
          for dir in \
            examples/mixed-federation/host-vite \
            examples/mixed-federation/remote-rspack \
            examples/mixed-federation/remote-rsbuild \
            examples/mixed-federation-issues/host-vite \
            examples/mixed-federation-issues/remote-rspack \
            examples/mixed-federation-issues/remote-rsbuild
          do
            rm -rf "${dir}/dist" "${dir}/.mf" "${dir}/node_modules/.vite"
          done
      - uses: ./.github/actions/setup-vp
        with:
          node-version: ${{ matrix.node-version }}
          # Do not write the default-branch Actions cache after checking out a
          # workflow_dispatch pin. setup-vp caches otherwise.
          cache: false
      - run: vp exec playwright install chromium
      - name: Validate publishable tag
        run: vp run pack:check && vp run test:e2e
      - name: Pack the verified npm artifact
        if: matrix.node-version == 26
        env:
          EXPECTED_TAG: ${{ needs.pin-release.outputs.tag }}
          EXPECTED_SHA: ${{ needs.pin-release.outputs.oid }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-package
          mkdir -p release-package
          pnpm pack --pack-destination release-package
          test "$(find release-package -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          mv release-package/*.tgz release-package/package.tgz

          PACKAGE_JSON="$(tar -xOf release-package/package.tgz package/package.json)"
          PACKAGE_NAME="$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          PACKAGE_VERSION="$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          test "$PACKAGE_NAME" = "@tonoizer/mfdoctor"
          test "$PACKAGE_VERSION" = "$EXPECTED_TAG"
          printf '%s\n' "$EXPECTED_TAG" > release-package/release-tag
          printf '%s\n' "$EXPECTED_SHA" > release-package/release-sha
          (
            cd release-package
            sha256sum package.tgz release-tag release-sha > SHA256SUMS
          )
      - name: Upload the verified npm artifact
        if: matrix.node-version == 26
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-npm-package
          path: release-package
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  stage:
    needs: [pin-release, verify]
    if: needs.pin-release.outputs.package-exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: npm
    steps:
      - name: Download the verified npm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-npm-package
          path: release-package
      - name: Validate the verified npm artifact handoff
        id: package
        env:
          EXPECTED_TAG: ${{ needs.pin-release.outputs.tag }}
          EXPECTED_SHA: ${{ needs.pin-release.outputs.oid }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-package/package.tgz
          test -f release-package/release-tag
          test -f release-package/release-sha
          test -f release-package/SHA256SUMS
          (
            cd release-package
            sha256sum --check SHA256SUMS
          )
          test "$(cat release-package/release-tag)" = "$EXPECTED_TAG"
          test "$(cat release-package/release-sha)" = "$EXPECTED_SHA"

          PACKAGE_JSON="$(tar -xOf release-package/package.tgz package/package.json)"
          PACKAGE_NAME="$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          PACKAGE_VERSION="$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          test "$PACKAGE_NAME" = "@tonoizer/mfdoctor"
          test "$PACKAGE_VERSION" = "$EXPECTED_TAG"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - run: npm install --global npm@11.17.0
      - name: Select npm tag
        id: npm
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          case "${VERSION}" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT";;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT";;
          esac
      - name: Refuse existing version
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "@tonoizer/mfdoctor@${VERSION}" version >/dev/null 2>&1; then
            echo "Refusing to overwrite @tonoizer/mfdoctor@${VERSION}"
            exit 1
          fi
      - name: Stage with trusted publishing
        env:
          NPM_TAG: ${{ steps.npm.outputs.tag }}
        run: npm stage publish release-package/package.tgz --access public --tag "$NPM_TAG"
      - name: Summary
        if: always()
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version || 'unknown' }}
          NPM_TAG: ${{ steps.npm.outputs.tag || 'unknown' }}
        run: |
          echo "## npm staged release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`@tonoizer/mfdoctor\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$PACKAGE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm tag: \`$NPM_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication: GitHub OIDC; no long-lived publish token" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: approve the staged package with npm account 2FA" >> "$GITHUB_STEP_SUMMARY"

  promote-github-release:
    name: Publish draft GitHub Release
    # No job-level `if:`: a skipped or failed `stage` (Verify failed, Stage
    # never ran, Stage failed, or first-package bootstrap) must leave the
    # GitHub Release as a draft. Any `if:` that stays true when `stage` is
    # skipped would run this job anyway.
    needs: [pin-release, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft after successful npm stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.pin-release.outputs.tag }}
        run: |
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "Release $TAG is already published"
            exit 0
          fi
          # GITHUB_TOKEN will not emit a recursive `release: published` run.
          gh release edit "$TAG" --draft=false
          echo "## GitHub Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Promoted draft \`$TAG\` after successful \`npm stage publish\`." >> "$GITHUB_STEP_SUMMARY"

  bootstrap-notice:
    name: First-package bootstrap required
    needs: [pin-release, verify]
    if: needs.pin-release.outputs.package-exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Record the one-time manual bootstrap boundary
        env:
          TAG: ${{ needs.pin-release.outputs.tag }}
          SHA: ${{ needs.pin-release.outputs.oid }}
        run: |
          echo "## First npm publish: one-time manual bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "The npm package does not exist yet, so npm cannot accept a trusted publisher." >> "$GITHUB_STEP_SUMMARY"
          echo "After explicit release approval, check out the clean tag \`$TAG\` at \`$SHA\` and run:" >> "$GITHUB_STEP_SUMMARY"
          echo '\`npm publish --access public --tag next\`' >> "$GITHUB_STEP_SUMMARY"
          echo "Then configure the npm trusted publisher for this workflow. No package was published by this run." >> "$GITHUB_STEP_SUMMARY"
