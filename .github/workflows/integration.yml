name: Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: 24
      - run: vp run build
      - run: vp run test:integration
      # One-rule showcase fixtures (config, shared, federation, runtime).
      - run: node scripts/demo-showcase.mjs
      # Red multi-bundler demo: asserts planted findings and federation conflicts.
      - run: node scripts/demo-mixed-issues.mjs
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: doctor-integration
          path: |
            examples/mixed-federation/*/.mf/doctor
            examples/mixed-federation-issues/*/.mf/doctor
          if-no-files-found: ignore
