name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: 24
      - run: vp run fmt:check
      - run: vp run lint
      - run: vp run changeset:check
      # Examples resolve @tonoizer/mfdoctor/* from dist/; build before typecheck.
      - run: vp run --filter . build
      - run: vp run inventory:check
      - run: node scripts/evidence-drift-check.mjs
      - run: vp run typecheck
      - run: vp run docs:build
      - run: vp run test:unit
