name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: npm install --global pnpm@11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm changeset:check
      # Examples resolve @tonoizer/mfdoctor/* from dist/; build before typecheck.
      - run: pnpm build
      - run: pnpm inventory:check
      - run: node scripts/evidence-drift-check.mjs
      - run: pnpm typecheck
      - run: pnpm docs:build
      - run: pnpm test:unit
