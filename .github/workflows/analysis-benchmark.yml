name: Analysis benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run bounded analysis benchmark matrix
        run: pnpm benchmark:analysis -- --output "analysis-cost-node${{ matrix.node }}.json"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: analysis-cost-node${{ matrix.node }}
          path: analysis-cost-node${{ matrix.node }}.json
          if-no-files-found: ignore
