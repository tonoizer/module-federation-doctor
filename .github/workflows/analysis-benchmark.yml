name: Analysis benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-vp
        with:
          node-version: ${{ matrix.node }}
      - name: Run bounded analysis benchmark matrix
        run: vp run benchmark:analysis --output "analysis-cost-node${{ matrix.node }}.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-cost-node${{ matrix.node }}
          path: analysis-cost-node${{ matrix.node }}.json
          if-no-files-found: error
