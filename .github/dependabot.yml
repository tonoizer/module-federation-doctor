version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep routine updates enabled for the root package and apps. Dependabot's
    # default limit of five open version PRs is sufficient here.
    #
    # The examples and fixtures are compatibility/E2E contracts (including
    # intentional Vite 5 cells), not ordinary application dependencies. Skip
    # their manifests entirely so those pinned contracts do not create routine
    # update PRs; re-enable a path deliberately when its contract changes.
    exclude-paths:
      - "examples/**"
      - "fixtures/**"
